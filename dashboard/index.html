<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NOVA — لوحة التحكم</title>
<meta name="theme-color" content="#0C0C0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- شاشة الدخول -->
<div id="login-view" class="login-wrap">
  <form class="login-card" id="login-form">
    <h1 class="en">NOVA</h1>
    <p class="sub en">Run Smarter. Serve Better.</p>
    <div id="login-error" class="msg msg-error" hidden></div>
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" autocomplete="username" required dir="ltr">
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" autocomplete="current-password" required dir="ltr">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="login-btn">دخول</button>
  </form>
</div>

<!-- التطبيق -->
<div id="app-view" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand en">NO<span>VA</span></div>
    <div class="rest-name" id="rest-name">—</div>
    <nav id="nav"></nav>
    <div class="nav-spacer"></div>
    <div class="nav-user">
      <strong id="user-name">—</strong>
      <span id="user-role">—</span>
    </div>
    <button class="btn btn-ghost btn-sm" id="logout-btn">خروج</button>
  </aside>

  <main class="main">
    <button class="menu-toggle" id="menu-toggle">☰ القائمة</button>
    <div id="page"></div>
  </main>
</div>

<div id="modal-root"></div>

<script type="module" src="app.js"></script>
</body>
</html>
