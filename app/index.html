<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6efe6" />
    <title>خليها مشاوي | اطلب أونلاين</title>
    <meta name="description" content="اطلب من مطعم خليها مشاوي أونلاين: فروع العاشر من رمضان والزقازيق والتجمع الخامس. توصيل أو استلام، والدفع كاش." />
    <!-- How the link looks when shared on WhatsApp or Facebook. The image needs the site's full address;
         change it here if the site moves to its own domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:site_name" content="خليها مشاوي" />
    <meta property="og:title" content="خليها مشاوي | اطلب أونلاين" />
    <meta property="og:description" content="الشوي على أصوله. اطلب من فروع العاشر من رمضان والزقازيق والتجمع الخامس، توصيل أو استلام، والدفع كاش." />
    <meta property="og:url" content="https://khaliha-mashawy.pages.dev/" />
    <meta property="og:image" content="https://khaliha-mashawy.pages.dev/brand/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="شعار خليها مشاوي" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Opening screen (owner's choice, 20 Nov 2026: no animation): the gold logo, still, on the brand's
         dark brown, only for as long as the app takes to load. Kept in the page itself so a slow
         connection never shows a blank screen; main.tsx removes it once the first screen has drawn. */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: radial-gradient(80% 60% at 50% 40%, #4a301d, #1f140c 75%);
        transition: opacity 0.2s ease, visibility 0.2s;
      }
      #splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash img { display: block; width: 140px; height: auto; }
    </style>
  </head>
  <body style="margin: 0; background: #f6efe6">
    <!-- Shown until the app starts, so a slow connection never shows a blank screen. -->
    <div id="splash" role="status" aria-label="جاري تحميل خليها مشاوي">
      <img src="/brand/logo-gold-sm.png" alt="" width="200" height="161" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
