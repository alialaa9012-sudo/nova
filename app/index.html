<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6efe6" />
    <title>خليها مشاوي | اطلب أونلاين</title>
    <meta name="description" content="اطلب من مطعم خليها مشاوي أونلاين: فروع العاشر من رمضان والزقازيق والتجمع الخامس. توصيل أو استلام، والدفع كاش." />
    <!-- How the link looks when shared on WhatsApp or Facebook. og:image needs the site's full address, added once the domain exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:site_name" content="خليها مشاوي" />
    <meta property="og:title" content="خليها مشاوي | اطلب أونلاين" />
    <meta property="og:description" content="الشوي على أصوله. اطلب من فروع العاشر من رمضان والزقازيق والتجمع الخامس، توصيل أو استلام، والدفع كاش." />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Opening screen: the gold logo on the brand's dark brown while the app loads. It sits over the
         app and fades out once the first screen has drawn (main.tsx). Kept in the page itself so it
         shows before any script or font has arrived. */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: radial-gradient(80% 60% at 50% 40%, #4a301d, #1f140c 75%);
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .stage { position: relative; display: grid; justify-items: center; gap: 30px; }
      #splash .glow {
        position: absolute; top: 50%; left: 50%; width: 260px; height: 260px; margin: -160px 0 0 -130px;
        border-radius: 50%; background: radial-gradient(circle, rgba(214, 178, 118, 0.32), transparent 65%);
        animation: km-breathe 2.4s ease-in-out infinite;
      }
      #splash .logo { position: relative; width: 140px; height: 113px; animation: km-in 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      #splash .logo img { display: block; width: 100%; height: 100%; animation: km-glow 2.4s ease-in-out 0.8s infinite; }
      /* A band of light that crosses the logo itself: the logo is the mask, so only its gold lines shine. */
      #splash .logo .sheen {
        position: absolute; inset: 0;
        -webkit-mask: url(/brand/logo-gold-sm.png) center / contain no-repeat; mask: url(/brand/logo-gold-sm.png) center / contain no-repeat;
        background: linear-gradient(105deg, transparent 30%, #fff8e6 46%, #fff8e6 54%, transparent 70%) 200% 0 / 250% 100% no-repeat;
        animation: km-sheen 2.2s ease-in-out 0.6s infinite;
      }
      #splash .bar { position: relative; width: 120px; height: 2px; overflow: hidden; border-radius: 2px; background: rgba(214, 178, 118, 0.2); animation: km-fade 0.6s 0.3s both; }
      #splash .bar::after {
        content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #d6b276, transparent); animation: km-run 1.2s ease-in-out infinite;
      }
      @keyframes km-in { from { opacity: 0; transform: scale(0.88); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes km-glow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(214, 178, 118, 0)); } 50% { filter: drop-shadow(0 0 12px rgba(214, 178, 118, 0.7)); } }
      @keyframes km-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes km-breathe { 0%, 100% { opacity: 0.55; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes km-sheen { 0% { background-position: 200% 0; } 60%, 100% { background-position: -100% 0; } }
      @keyframes km-run { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation: none !important; }
        #splash .bar { display: none; }
      }
    </style>
  </head>
  <body style="margin: 0; background: #f6efe6">
    <!-- Shown until the app starts, so a slow connection never shows a blank screen. -->
    <div id="splash" role="status" aria-label="جاري تحميل خليها مشاوي">
      <div class="stage">
        <div class="glow"></div>
        <div class="logo">
          <img src="/brand/logo-gold-sm.png" alt="" width="200" height="161" fetchpriority="high" />
          <div class="sheen"></div>
        </div>
        <div class="bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
